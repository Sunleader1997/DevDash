appId: com.devdash.desktop
productName: DevDash
copyright: Copyright © 2026 DevDash
directories:
  output: release
  buildResources: assets/icons

# electron-vite already bundles main/preload/renderer and plugin UI.
# Only ship built artifacts + plugin manifests — never sources or node_modules.
files:
  - package.json
  - out/**/*
  - plugins/**/package.json
  - plugins/**/dist/**/*
  - assets/**/*
  - "!**/node_modules/**"
  - "!**/*.{map,ts,tsx,md,log}"
  - "!plugins/**/src/**"
  - "!plugins/**/{tsconfig.json,vite.config.ts,package-lock.json}"
  - "!{src,docs,scripts,build,release}/**"
  - "!*.{md,txt,yml,yaml,jsonc}"
  - "!dev-*.txt"
  - "!electron-*.txt"
  - "!tsconfig*.json"
  - "!electron.vite.config.ts"

asar: true
# Plugin main is dynamically imported; keep plugins readable if asar ever
# interferes with the custom protocol, but start packed.
# asarUnpack:
#   - plugins/**

# Preinstalled agent skills (compose-next / devdash-plugin-dev / playwright).
# Must use extraResources so SKILL.md survives the files `!*.md` exclude.
extraResources:
  - from: bundled-skills
    to: skills
  # Unpacked app icon: dock/window load from resourcesPath (not asar), and
  # mac bundle CFBundleIconFile comes from buildResources icon.icns.
  - from: assets/icons/icon.png
    to: app-icon/icon.png
  - from: assets/icons/icon-flat.png
    to: app-icon/icon-flat.png
  - from: assets/icons/icon.icns
    to: app-icon/icon.icns
  - from: assets/icons/icon.ico
    to: app-icon/icon.ico
  # Native Claude Code CLI for @anthropic-ai/claude-agent-sdk.
  # Optional platform package is not collected from nested optionalDependencies;
  # also cannot be spawned from inside asar — ship unpacked and pass
  # pathToClaudeCodeExecutable at query time.
  - from: node_modules/@anthropic-ai/claude-agent-sdk-win32-x64/claude.exe
    to: claude/claude.exe

mac:
  icon: assets/icons/icon.icns

win:
  icon: assets/icons/icon.ico
  # Also embed matching installer/uninstaller icons so NSIS never falls back.
  installerIcon: assets/icons/icon.ico
  uninstallerIcon: assets/icons/icon.ico
  target:
    - target: nsis
      arch:
        - x64
    - target: zip
      arch:
        - x64
  artifactName: ${name}-${version}-win-${arch}.${ext}

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: DevDash
  artifactName: ${name}-${version}-win-${arch}-setup.${ext}
