appId: com.devdash.desktop
productName: DevDash
copyright: Copyright © 2026 DevDash
directories:
  output: release
  buildResources: assets/icons

# electron-vite already bundles main/preload/renderer and plugin UI.
# Only ship built artifacts + plugin manifests — never sources or node_modules.
files:
  - package.json
  - out/**/*
  - plugins/**/package.json
  - plugins/**/dist/**/*
  - assets/**/*
  - "!**/node_modules/**"
  - "!**/*.{map,ts,tsx,md,log}"
  - "!plugins/**/src/**"
  - "!plugins/**/{tsconfig.json,vite.config.ts,package-lock.json}"
  - "!{src,docs,scripts,build,release}/**"
  - "!*.{md,txt,yml,yaml,jsonc}"
  - "!dev-*.txt"
  - "!electron-*.txt"
  - "!tsconfig*.json"
  - "!electron.vite.config.ts"

# Pin Electron dist mirror. Default GitHub is often unreachable/slow from CN;
# cache hits still download SHASUMS256.txt from the same origin for validation,
# so an unset mirror can hang packaging at "packaging" with 0-byte temp files.
electronDownload:
  mirror: https://npmmirror.com/mirrors/electron/

asar: true
# Plugin main is dynamically imported; keep plugins readable if asar ever
# interferes with the custom protocol, but start packed.
# asarUnpack:
#   - plugins/**

# Preinstalled agent skills (compose-next / devdash-plugin-dev / playwright).
# Must use extraResources so SKILL.md survives the files `!*.md` exclude.
extraResources:
  - from: bundled-skills
    to: skills
  # User-plugin SDK (shims, template, create/build scripts).
  - from: bundled-plugin-sdk
    to: plugin-sdk
  # esbuild-wasm for plugin-sdk/build.mjs (vendored; not shipped via node_modules).
  - from: node_modules/esbuild-wasm
    to: plugin-sdk/vendor/esbuild-wasm
  # Unpacked app icon: dock/window load from resourcesPath (not asar), and
  # mac bundle CFBundleIconFile comes from buildResources icon.icns.
  - from: assets/icons/icon.png
    to: app-icon/icon.png
  - from: assets/icons/icon-flat.png
    to: app-icon/icon-flat.png
  - from: assets/icons/icon.icns
    to: app-icon/icon.icns
  - from: assets/icons/icon.ico
    to: app-icon/icon.ico
  # Native Claude Code CLI for @anthropic-ai/claude-agent-sdk.
  # Optional platform packages are not collected from nested optionalDependencies;
  # binary cannot be spawned from inside asar. Stage the right arch via
  # scripts/stage-claude-bin.mjs before pack (pack:win / pack:mac / pack:linux do this).
  - from: build/claude-bin
    to: claude

mac:
  icon: assets/icons/icon.icns
  category: public.app-category.developer-tools
  # No Apple Developer ID in this environment — skip signing so the build
  # still produces a runnable app (users right-click → Open on first launch).
  identity: null
  target:
    - target: dmg
      arch:
        - arm64
  artifactName: ${name}-${version}-mac-${arch}.${ext}

# dmg options are top-level (not under mac)
dmg:
  artifactName: ${name}-${version}-mac-${arch}.${ext}

win:
  icon: assets/icons/icon.ico
  target:
    - target: nsis
      arch:
        - x64
  artifactName: ${name}-${version}-win-${arch}.${ext}

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: DevDash
  artifactName: ${name}-${version}-win-${arch}-setup.${ext}
  # NSIS-only icon fields (not valid under win)
  installerIcon: assets/icons/icon.ico
  uninstallerIcon: assets/icons/icon.ico

# Linux x86_64 (x64). AppImage is the portable default; deb for Debian/Ubuntu.
# iconset/ holds size-named PNGs (16..1024) which electron-builder picks up.
linux:
  icon: assets/icons/iconset
  category: Development
  synopsis: Plugin-based developer dashboard
  syncDesktopName: true
  # deb/rpm require a maintainer with an email; package.json author is bare.
  maintainer: DevDash <devdash@users.noreply.github.com>
  desktop:
    entry:
      Name: DevDash
      Comment: Plugin-based cross-platform developer dashboard
      Categories: Development;Utility;
      StartupWMClass: DevDash
  target:
    - target: AppImage
      arch:
        - x64
    - target: deb
      arch:
        - x64
  artifactName: ${name}-${version}-linux-${arch}.${ext}

appImage:
  artifactName: ${name}-${version}-linux-${arch}.${ext}

deb:
  artifactName: ${name}-${version}-linux-${arch}.${ext}
